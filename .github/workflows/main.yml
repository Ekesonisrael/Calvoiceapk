name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: mkdir -p www && cp index.html www/index.html
      - run: npx cap add android
      - run: npx cap sync android
      - name: Mic permission
        run: |
          sed -i 's|</manifest>|<uses-permission android:name="android.permission.RECORD_AUDIO"/></manifest>|' android/app/src/main/AndroidManifest.xml
      - name: Icons
        continue-on-error: true
        run: |
          pip install pillow
          python3 - <<'PY'
          import shutil
          from PIL import Image
          R = "android/app/src/main/res"
          shutil.rmtree(R + "/mipmap-anydpi-v26", ignore_errors=True)
          im = Image.open("icon.png").convert("RGBA")
          for n, z in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              for f in ["ic_launcher", "ic_launcher_round", "ic_launcher_foreground"]:
                  im.resize((z, z), Image.LANCZOS).save(f"{R}/mipmap-{n}/{f}.png")
          PY
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CalVoice-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
